<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<title>宿舍合約後台已搬家｜鼎兆元</title>
<style>
  :root{--ink:#1c1a19;--muted:#6f665f;--line:#e2dbd4;--bg:#f7f4f1;--card:#fff;--brand:#c8402c;--brand-dark:#a33322;--note-bg:#fff8e6}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
    background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.7}
  .card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .tag{display:inline-block;font-size:13px;color:var(--brand);border:1px solid var(--brand);border-radius:999px;padding:2px 10px;margin-bottom:12px}
  h1{font-size:22px;margin:0 0 12px}
  p{margin:0 0 12px;font-size:16px}
  ul{margin:0 0 16px;padding-left:1.2em} li{margin:2px 0}
  .btn{display:block;text-align:center;background:var(--brand);color:#fff;text-decoration:none;font-size:17px;font-weight:600;
    padding:14px 16px;border-radius:10px;margin:20px 0 16px}
  .btn:hover,.btn:focus{background:var(--brand-dark)}
  .note{background:var(--note-bg);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--ink)}
  .muted{color:var(--muted);font-size:14px;margin-top:16px}
</style>
</head>
<body>
<main class="card">
  <span class="tag">網址已更換</span>
  <h1>宿舍合約後台已搬進管理系統</h1>
  <p>以下功能都改到「鼎兆元管理系統」的「宿舍合約」裡使用：</p>
  <ul><li>新增合約、產生簽約連結</li><li>合約清單</li><li>開點交單</li></ul>
  <a class="btn" href="https://dzy.mozhuting.com/">前往鼎兆元管理系統</a>
  <p class="note">同仁收到的<b>簽約連結、點交單連結照常可以用</b>，不受影響。</p>
  <p class="muted">用你自己的管理系統帳號登入。沒有帳號、或登入後看不到「宿舍合約」，請找資訊部 Eason。<br>舊網址自 2026-10-15 起停用，舊的通行碼已失效。</p>
</main>
</body>
</html>
